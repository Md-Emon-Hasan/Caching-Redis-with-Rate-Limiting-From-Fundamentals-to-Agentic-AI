services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro   # load balancer config
    depends_on:
      - api1
      - api2

  # Two identical FastAPI instances behind the load balancer —
  # this horizontal scaling is what makes it "high traffic" ready.
  api1:
    build: .
    environment:
      - INSTANCE_NAME=api1
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
    depends_on:
      - redis
      - postgres

  api2:
    build: .
    environment:
      - INSTANCE_NAME=api2
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7-alpine

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # creates + seeds the products table
