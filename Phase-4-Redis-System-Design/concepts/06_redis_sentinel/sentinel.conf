# sentinel.conf
# Start with: redis-sentinel sentinel.conf
# (run 3 copies on ports 26379/26380/26381 for a real quorum setup)
port 26379
sentinel monitor mymaster 127.0.0.1 6379 2
# "2" = quorum: at least 2 sentinels must agree the master is down
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 10000
