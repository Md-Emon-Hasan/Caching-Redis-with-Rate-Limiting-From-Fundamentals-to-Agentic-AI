# ============================================================================
#  redis-production.conf - a sane, commented production baseline
#  Start with:  redis-server /path/to/redis-production.conf
# ============================================================================

# --- NETWORK ----------------------------------------------------------------
bind 0.0.0.0                 # listen on all interfaces (lock down with a firewall)
port 6379
protected-mode yes           # refuse outside connections unless authed/bound
tcp-backlog 511
timeout 0                    # never close idle client connections
tcp-keepalive 300            # detect dead peers

# --- SECURITY ---------------------------------------------------------------
# ALWAYS set a strong password in production (or use ACLs).
requirepass CHANGE_ME_TO_A_LONG_RANDOM_SECRET
# Rename or disable dangerous commands so a bad deploy can't nuke prod:
rename-command FLUSHALL ""
rename-command FLUSHDB  ""
rename-command KEYS     ""    # O(N) - forbid it; use SCAN instead

# --- MEMORY -----------------------------------------------------------------
maxmemory 4gb                # cap memory so Redis never eats the whole box
maxmemory-policy allkeys-lru # when full, evict least-recently-used keys
                             # (use noeviction if Redis is a primary DB, not a cache)

# --- PERSISTENCE: RDB snapshots (backups) -----------------------------------
save 900 1                   # snapshot if >=1 key changed in 900s
save 300 10                  # ...or >=10 keys in 300s
save 60 10000                # ...or >=10000 keys in 60s
dbfilename dump.rdb
dir /var/lib/redis
rdbcompression yes
rdbchecksum yes

# --- PERSISTENCE: AOF (durability) ------------------------------------------
appendonly yes               # enable the write log for low data loss
appendfsync everysec         # fsync once per second: lose <= ~1s on a crash
                             # (use "always" for max durability at a perf cost)
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# --- SLOW LOG (observability) -----------------------------------------------
slowlog-log-slower-than 10000  # log commands slower than 10ms (10000 microsec)
slowlog-max-len 128

# --- CLIENTS ----------------------------------------------------------------
maxclients 10000
