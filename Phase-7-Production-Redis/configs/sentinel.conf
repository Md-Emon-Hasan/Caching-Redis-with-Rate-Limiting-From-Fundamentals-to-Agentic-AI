# ============================================================================
#  sentinel.conf - one Sentinel process (run 3+ on separate hosts)
#  Start with:  redis-server /path/to/sentinel.conf --sentinel
# ============================================================================
port 26379
dir /tmp

# Watch the master called "mymaster". The trailing "2" is the QUORUM:
# at least 2 sentinels must agree the master is down to start a failover.
sentinel monitor mymaster 10.0.0.1 6379 2

# If the master doesn't respond for this long, a sentinel marks it down.
sentinel down-after-milliseconds mymaster 5000

# How many replicas to re-sync to the new master at once during failover
# (1 = one at a time, keeps replicas available during the switch).
sentinel parallel-syncs mymaster 1

# Give a failover this long to complete before retrying.
sentinel failover-timeout mymaster 15000

# If your master needs a password, sentinels need it too:
sentinel auth-pass mymaster CHANGE_ME_TO_A_LONG_RANDOM_SECRET
