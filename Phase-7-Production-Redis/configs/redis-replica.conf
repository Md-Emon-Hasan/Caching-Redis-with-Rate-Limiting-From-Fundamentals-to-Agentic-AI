# ============================================================================
#  redis-replica.conf - configuration for a REPLICA node
#  Inherits the production baseline; adds the replication link.
# ============================================================================
port 6379
dir /var/lib/redis

# This one line makes the node a replica of the given master:
replicaof 10.0.0.1 6379        # <-- point at your MASTER's ip:port

# If the master requires a password (it should), provide it here:
masterauth CHANGE_ME_TO_A_LONG_RANDOM_SECRET
requirepass CHANGE_ME_TO_A_LONG_RANDOM_SECRET

# Keep replicas read-only (default). Reads go here; writes go to the master.
replica-read-only yes

# Serve slightly-stale data even while syncing (better availability):
replica-serve-stale-data yes

# Persistence still recommended on replicas so they can restart independently.
appendonly yes
appendfsync everysec
