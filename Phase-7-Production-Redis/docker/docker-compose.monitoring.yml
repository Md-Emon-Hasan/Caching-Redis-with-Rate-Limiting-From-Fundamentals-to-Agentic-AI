# ============================================================================
#  docker-compose.monitoring.yml
#  Redis + a full observability stack: redis_exporter scrapes Redis metrics,
#  Prometheus stores them, Grafana graphs them. Concept 5 in production form.
#
#  Run:  docker compose -f docker-compose.monitoring.yml up -d
#  Grafana:    http://localhost:3000  (login admin / admin)
#  Prometheus: http://localhost:9090
#  In Grafana, add Prometheus (http://prometheus:9090) as a data source and
#  import dashboard ID 763 (the official Redis dashboard).
# ============================================================================
services:
  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb",
              "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]

  # Translates Redis INFO into Prometheus metrics on :9121/metrics
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
    ports: ["9121:9121"]
    depends_on: [redis]

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [redis-exporter]

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on: [prometheus]
