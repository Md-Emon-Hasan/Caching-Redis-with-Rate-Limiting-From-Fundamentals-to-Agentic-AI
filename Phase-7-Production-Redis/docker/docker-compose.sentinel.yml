# ============================================================================
#  docker-compose.sentinel.yml
#  A highly-available setup: 1 master, 1 replica, and 3 Sentinels (quorum 2).
#  If the master dies, the sentinels promote the replica automatically.
#  Concept 3 in a runnable Docker form.
#
#  Run:  docker compose -f docker-compose.sentinel.yml up -d
#  Test failover:  docker stop redis-master   (then watch a sentinel)
#  Ask a sentinel who the master is:
#     docker exec -it sentinel-1 redis-cli -p 26379 \
#         SENTINEL get-master-addr-by-name mymaster
# ============================================================================
services:
  redis-master:
    image: redis:7-alpine
    container_name: redis-master
    command: ["redis-server", "--appendonly", "yes"]

  redis-replica:
    image: redis:7-alpine
    container_name: redis-replica
    command: ["redis-server", "--replicaof", "redis-master", "6379",
              "--appendonly", "yes"]
    depends_on: [redis-master]

  # Three sentinels. Each uses the same inline config via 'sh -c' so no extra
  # files are needed. In real deployments put these on 3 separate machines.
  sentinel-1: &sentinel
    image: redis:7-alpine
    container_name: sentinel-1
    depends_on: [redis-master, redis-replica]
    command: >
      sh -c '
      echo "port 26379" > /tmp/s.conf &&
      echo "sentinel monitor mymaster redis-master 6379 2" >> /tmp/s.conf &&
      echo "sentinel down-after-milliseconds mymaster 5000" >> /tmp/s.conf &&
      echo "sentinel failover-timeout mymaster 15000" >> /tmp/s.conf &&
      echo "sentinel parallel-syncs mymaster 1" >> /tmp/s.conf &&
      redis-server /tmp/s.conf --sentinel
      '

  sentinel-2:
    <<: *sentinel
    container_name: sentinel-2

  sentinel-3:
    <<: *sentinel
    container_name: sentinel-3
