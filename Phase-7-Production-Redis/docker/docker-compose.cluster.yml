              "--cluster-node-timeout", "5000", "--appendonly", "yes"]

  redis-node-5:
    image: redis:7-alpine
    container_name: redis-node-5
    network_mode: host
    command: ["redis-server", "--port", "7005", "--cluster-enabled", "yes",
